<ion-header>
    <ion-toolbar>
        <ion-title>Ubicación</ion-title>
        <core-user-menu-button slot="end" />
    </ion-toolbar>
</ion-header>

<ion-content class="moot-location-content">

    <!-- ── Hero ─────────────────────────────────────────────────────────── -->
    <div class="moot-location-hero">
        <img src="assets/img/moodlemoot/logo-puce-sede.png"
             alt="Pontificia Universidad Católica del Ecuador"
             class="moot-location-hero-logo" />
    </div>

    <!-- ── Address card ──────────────────────────────────────────────────── -->
    <div class="moot-location-card">
        <div class="moot-location-row">
            <ion-icon name="due-location-dot-duotone" class="moot-location-row-icon" aria-hidden="true" />
            <div class="moot-location-row-content">
                <p class="moot-location-row-label">Dirección</p>
                <p class="moot-location-row-value">{{ venueAddress }}</p>
            </div>
        </div>

        @if (venueDescription) {
            <div class="moot-location-divider"></div>
            <div class="moot-location-row">
                <ion-icon name="fas-circle-info" class="moot-location-row-icon" aria-hidden="true" />
                <div class="moot-location-row-content">
                    <p class="moot-location-row-label">Sobre el lugar</p>
                    <p class="moot-location-row-value">{{ venueDescription }}</p>
                </div>
            </div>
        }
    </div>

    <!-- ── Croquis ───────────────────────────────────────────────────────── -->
    @if (croquisUrl) {
        <div class="moot-location-section">
            <h2 class="moot-location-section-title">
                <ion-icon name="fas-map" aria-hidden="true" />
                Croquis del lugar
            </h2>

            <div class="moot-location-croquis-card">
                <div class="moot-location-croquis-preview">
                    <img [src]="croquisUrl" alt="Croquis del campus PUCE" class="moot-location-croquis-thumb" />
                </div>
                <div class="moot-location-croquis-bar">
                    <span class="moot-location-croquis-hint">
                        <ion-icon name="fas-map" aria-hidden="true" />
                        Campus PUCE — 5 sedes
                    </span>
                    <button class="moot-location-croquis-open-btn" (click)="openCroquis()"
                            aria-label="Ver mapa completo">
                        <ion-icon name="fas-expand" aria-hidden="true" />
                        Ver mapa completo
                    </button>
                </div>
            </div>
        </div>
    }

    <!-- ── Map card ──────────────────────────────────────────────────────── -->
    <div class="moot-location-section">
        <h2 class="moot-location-section-title">
            <ion-icon name="due-map-location" aria-hidden="true" />
            Cómo llegar
        </h2>

        <div class="moot-location-map-card" (click)="openInMaps()">
            <div class="moot-location-map-bg">
                <!-- Decorative grid lines -->
                <svg class="moot-map-grid" aria-hidden="true" viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice">
                    <line x1="0" y1="40"  x2="320" y2="40"  stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                    <line x1="0" y1="80"  x2="320" y2="80"  stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                    <line x1="0" y1="120" x2="320" y2="120" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                    <line x1="80"  y1="0" x2="80"  y2="160" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                    <line x1="160" y1="0" x2="160" y2="160" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                    <line x1="240" y1="0" x2="240" y2="160" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                    <!-- Simulated roads -->
                    <line x1="0" y1="80"  x2="320" y2="80"  stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
                    <line x1="160" y1="0" x2="160" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
                </svg>
                <!-- Pin -->
                <div class="moot-map-pin">
                    <ion-icon name="due-location-dot-duotone" aria-hidden="true" />
                </div>
            </div>
            <div class="moot-location-map-footer">
                <div class="moot-location-map-text">
                    <p class="moot-location-map-name">{{ venueName }}</p>
                    <p class="moot-location-map-addr">{{ venueAddress }}</p>
                </div>
                <div class="moot-location-map-cta">
                    <ion-icon name="due-map-location" aria-hidden="true" />
                    <span>Abrir en<br>Google Maps</span>
                </div>
            </div>
        </div>
    </div>

</ion-content>

<!-- ── Croquis fullscreen overlay ────────────────────────────────────────── -->
@if (croquisFullscreen) {
    <div class="moot-croquis-overlay" role="dialog" aria-modal="true" aria-label="Croquis ampliado">
        <button class="moot-croquis-close" (click)="closeCroquis()" aria-label="Cerrar">
            <ion-icon name="fas-xmark" aria-hidden="true" />
        </button>
        <div class="moot-croquis-scroll" (click)="closeCroquis()">
            <img [src]="croquisUrl" alt="Croquis del campus PUCE" class="moot-croquis-full-img"
                 (click)="$event.stopPropagation()" />
        </div>
        <p class="moot-croquis-dismiss-hint">Toca fuera para cerrar</p>
    </div>
}
